# Derived from replogle-stage1-fsq-mse.yaml; separate smoke-test checkpoints.
run_name: replogle-stage1-fsq-mse-seed401-smoke
prefix_run_name_with_datetime: false
work_dir: outputs/replogle_stage1
seed: 401
n_iters: 75000
learning_rate: 0.0006
weight_decay: 0.001
grad_clip: 5.0
warmup_steps: 2500
lr_schedule: cosine
mixed_precision: bf16
log_freq: 100
eval_freq: 5000
save_freq: 5000
dataset:
  h5ad_paths:
  - datasets/replogle/K562_essential_raw_singlecell_01.h5ad
  - datasets/replogle/hepg2_raw_singlecell_01.h5ad
  - datasets/replogle/jurkat_raw_singlecell_01.h5ad
  - datasets/replogle/rpe1_raw_singlecell_01.h5ad
  gene_order_path: assets/replogle_scldm2k_gene_order.ensembl.txt
  num_hvg: 2000
  split_path: assets/scldm_replogle_test.json
  ctrl_label: non-targeting
  min_genes: 200
  min_cells: 3
  target_sum: null
  apply_normalize: true
  apply_log1p: true
  use_binning: none
  pert_mapping_path: null
  batch_size: 128
  num_workers: 0
  load_lazily: false
  deg_table_path: null
model:
  type: vae
  num_latent_tokens: 64
  do_pert_cond: false
  do_celltype_cond: false
  train_pert_classifier: false
  train_pert_regressor: false
  encoder:
    type: cross_attention
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    attn_dropout: 0.1
  decoder:
    type: cross_attention
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    attn_dropout: 0.1
  quantizer:
    type: fsq
    codebook_size: 512
  input_head:
    type: mlp
  output_head:
    type: mse
wandb:
  enabled: false
  project: sc_evae
dry_run: true
profile: true
profile_n_steps: 50
profile_warmup_steps: 10
