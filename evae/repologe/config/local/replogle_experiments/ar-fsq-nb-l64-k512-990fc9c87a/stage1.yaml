run_name: stage1
seed: 401
work_dir: outputs/replogle_experiments/ar-fsq-nb-l64-k512-990fc9c87a
n_iters: 75000
learning_rate: 0.0006
warmup_steps: 2500
log_freq: 100
eval_freq: 5000
save_freq: 5000
lr_schedule: cosine
dataset:
  h5ad_paths:
  - datasets/replogle/K562_essential_raw_singlecell_01.h5ad
  - datasets/replogle/hepg2_raw_singlecell_01.h5ad
  - datasets/replogle/jurkat_raw_singlecell_01.h5ad
  - datasets/replogle/rpe1_raw_singlecell_01.h5ad
  gene_order_path: assets/replogle_scldm2k_gene_order.ensembl.txt
  num_hvg: 2000
  split_path: assets/scldm_replogle_test.json
  ctrl_label: non-targeting
  min_genes: 200
  min_cells: 3
  target_sum: null
  apply_normalize: false
  apply_log1p: false
  use_binning: none
  pert_mapping_path: null
  batch_size: 128
  num_workers: 0
  load_lazily: false
  deg_table_path: outputs/replogle_experiments/ar-fsq-nb-l64-k512-990fc9c87a/stage1-smoke/deg_table.pt
model:
  type: vae
  num_latent_tokens: 64
  encoder:
    type: cross_attention
  decoder:
    type: cross_attention
  quantizer:
    type: fsq
    codebook_size: 512
  input_head:
    type: mlp
  output_head:
    type: nb
    temperature: 1.0
    min_theta: 0.01
  do_pert_cond: false
  do_celltype_cond: false
  train_pert_classifier: false
  train_pert_regressor: false
wandb:
  enabled: true
  project: sc_evae
prefix_run_name_with_datetime: false
grad_clip: 5.0
weight_decay: 0.001
mixed_precision: bf16
