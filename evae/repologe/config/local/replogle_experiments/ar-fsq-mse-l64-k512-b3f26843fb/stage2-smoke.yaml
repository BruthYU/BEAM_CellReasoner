run_name: stage2-smoke
seed: 420
work_dir: outputs/replogle_experiments/ar-fsq-mse-l64-k512-b3f26843fb
n_iters: 75000
learning_rate: 0.0002
warmup_steps: 3000
grad_clip: 1.0
log_freq: 100
eval_freq: 5000
save_freq: 5000
lr_schedule: cosine
max_val_iters: 500
dataset:
  apply_log1p: true
  apply_normalize: true
  batch_size: 128
  ctrl_label: non-targeting
  ctrl_labels: []
  deg_table_path: outputs/replogle_stage1/replogle-stage1-fsq-mse-seed401-smoke/deg_table.pt
  donor_col: null
  gene_order_path: assets/replogle_scldm2k_gene_order.ensembl.txt
  h5ad_path: ''
  h5ad_paths:
  - datasets/replogle/K562_essential_raw_singlecell_01.h5ad
  - datasets/replogle/hepg2_raw_singlecell_01.h5ad
  - datasets/replogle/jurkat_raw_singlecell_01.h5ad
  - datasets/replogle/rpe1_raw_singlecell_01.h5ad
  load_lazily: false
  min_cells: 3
  min_genes: 200
  num_hvg: 2000
  num_workers: 0
  obs_filters: {}
  pert_col: gene
  pert_mapping_path: datasets/competition_support_set/ESM2_replogle_symbol_aligned.pt
  split_path: assets/scldm_replogle_test.json
  target_sum: null
  use_binning: none
  val_frac: 0.0
  val_pert_frac: 0.1
model:
  type: autoregressive
  vae_path: outputs/replogle_stage1/replogle-stage1-fsq-mse-seed401
  do_celltype_cond: true
  transformer:
    type: dit
    d_model: 384
    nhead: 8
    num_layers: 6
    dim_feedforward: 1536
    causal_input_mask: true
  output_head:
    type: cross_entropy
  do_pert_cond: true
  pert_cond_source: projected
wandb:
  enabled: false
  project: sc_evae
prefix_run_name_with_datetime: false
weight_decay: 0.001
mixed_precision: bf16
dry_run: true
profile: true
profile_n_steps: 50
profile_warmup_steps: 10
